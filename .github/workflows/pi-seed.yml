name: pi-seed

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: install from the lockfile
        run: npm ci

      - name: qemu-user and the arm64 libraries the official node binary needs
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          # Ubuntu 24.04 ships qemu-user-static (qemu-aarch64-static).
          # Ubuntu 26.04 makes that name virtual and ships qemu-user (qemu-aarch64).
          if apt-cache policy qemu-user-static | grep -q 'Candidate: (none)'; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-user
          else
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-user-static
          fi
          if [ -x /usr/bin/qemu-aarch64-static ]; then
            echo "qemu=/usr/bin/qemu-aarch64-static" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/qemu-aarch64 ]; then
            echo "qemu=/usr/bin/qemu-aarch64" >> "$GITHUB_ENV"
          else
            echo "refusing: qemu-user binary" >&2
            exit 1
          fi
          test -e /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1
          test -e /usr/aarch64-linux-gnu/lib/libstdc++.so.6

      - name: build the linux-arm64 and linux-x64 single executables
        run: node scripts/pi-seed/build.js

      - name: smoke-start linux-x64 and check /health
        run: node scripts/pi-seed/smoke.js build/pi-seed/out/galion-research-linux-x64

      - name: smoke-start linux-arm64 under qemu-user and check /health
        run: node scripts/pi-seed/smoke.js build/pi-seed/out/galion-research-linux-arm64 --qemu "$qemu" --sysroot /usr/aarch64-linux-gnu

      - name: pack research-pi5-seed archive
        id: pack
        run: |
          node scripts/pi-seed/pack.js
          sha=$(git rev-parse HEAD)
          archive="build/pi-seed/research-pi5-seed-${sha}.tar.gz"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "file=${archive}" >> "$GITHUB_OUTPUT"
          echo "archive bytes $(wc -c < "$archive")"
          wc -c build/pi-seed/out/galion-research-linux-arm64 build/pi-seed/out/galion-research-linux-x64 "$archive"

      # Owner decision: this upload has no file-type filter and no size cap.
      # compression-level 0 skips a second compression of the gzip. It is not a cap.
      - name: upload the seed archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-pi5-seed-${{ steps.pack.outputs.sha }}.tar.gz
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          compression-level: 0
