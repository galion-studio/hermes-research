name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build
        run: npm run build
      - name: audit
        run: npm run audit
      - name: test
        run: npm test
      - name: stub hermes and voice integration
        run: node --test --test-reporter=spec test/integration/stub-backends.test.js
      - name: cold start and resident memory
        run: |
          node scripts/measure-start.js | tee "$RUNNER_TEMP/start-measure.txt"
          {
            echo "### CI runner, not a Pi 5"
            echo
            echo "Cold start is the time from spawning the server until GET /health returns 200. Resident memory is VmRSS at that moment. These numbers were measured on this GitHub-hosted runner. They are not a Raspberry Pi 5 result."
            echo
            echo '```'
            cat "$RUNNER_TEMP/start-measure.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  playwright:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: audit
        working-directory: .
        run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
