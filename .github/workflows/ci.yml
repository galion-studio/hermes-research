name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: install from the lockfile
        run: npm ci && npm ci --prefix e2e
      - name: build
        run: npm run build
      - name: audit
        run: npm run audit
      - name: test
        run: npm test
      - name: stub hermes and voice integration
        run: node --test --test-reporter=spec test/integration/stub-backends.test.js
      - name: sbom
        run: node scripts/sbom.js
      # Owner decision: this upload has no file-type filter and no size cap.
      # compression-level 0 is not a cap.
      - name: upload the sbom
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: galion-research-sbom
          path: build/sbom/galion-research.spdx.json
          if-no-files-found: error
          compression-level: 0

  playwright:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: install the app from the lockfile
        working-directory: .
        run: npm ci
      - run: npm ci
      - name: audit
        working-directory: .
        run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
