name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: install from the lockfile
        run: npm ci && npm ci --prefix e2e
      - name: build
        run: npm run build
      - name: audit
        run: npm run audit
      - name: test
        run: npm test
      - name: stub hermes and voice integration
        run: node --test --test-reporter=spec test/integration/stub-backends.test.js
      - name: sbom
        run: node scripts/sbom.js
      # Owner decision: this upload has no file-type filter and no size cap.
      # compression-level 0 is not a cap.
      - name: upload the sbom
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galion-research-sbom
          path: build/sbom/galion-research.spdx.json
          if-no-files-found: error
          compression-level: 0

  playwright:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: install the app from the lockfile
        working-directory: .
        run: npm ci
      - run: npm ci
      - name: audit
        working-directory: .
        run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
